<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poll results</title></head>
<body style="margin:0;background:#f5f3ff;font-family:Arial,sans-serif;color:#172033">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f3ff;padding:28px 12px">
    <tr><td align="center">
      <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="max-width:620px;width:100%;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 18px 60px rgba(76,29,149,.14)">
        <tr><td style="padding:34px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff">
          <div style="font-size:12px;font-weight:800;letter-spacing:2px;opacity:.82">WEBPOOL · FINAL RESULTS</div>
          <h1 th:text="${pool.name}" style="margin:12px 0 8px;font-size:30px;line-height:1.15">Poll title</h1>
          <p style="margin:0;opacity:.86"><strong th:text="${totalResponses}">0</strong> responses · generated <span th:text="${generatedAt}">today</span></p>
        </td></tr>
        <tr><td style="padding:32px">
          <h2 style="margin:0 0 18px;font-size:20px">How everyone voted</h2>
          <table th:if="${!results.isEmpty()}" role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:separate;border-spacing:0 10px">
            <tr th:each="result : ${results}">
              <td style="padding:16px;border:1px solid #e9e5ff;border-radius:14px;background:#faf9ff">
                <div th:text="${result.option}" style="font-weight:800;margin-bottom:10px">Option</div>
                <span style="display:inline-block;margin-right:8px;color:#15803d"><b th:text="${result.yes}">0</b> yes</span>
                <span th:if="${result.maybe > 0}" style="display:inline-block;margin-right:8px;color:#a16207"><b th:text="${result.maybe}">0</b> maybe</span>
                <span th:if="${result.no > 0}" style="display:inline-block;color:#b91c1c"><b th:text="${result.no}">0</b> no</span>
              </td>
            </tr>
          </table>
          <div th:if="${!textAnswers.isEmpty()}" style="margin-top:22px">
            <h2 style="margin:0 0 12px;font-size:20px">Written answers</h2>
            <div th:each="item : ${textAnswers}" style="margin:10px 0;padding:16px;border-left:4px solid #8b5cf6;background:#faf9ff;border-radius:4px 12px 12px 4px">
              <b th:text="${item.participant}" style="display:block;color:#6d28d9;font-size:12px">Participant</b>
              <span th:text="${item.answer}" style="display:block;margin-top:6px;line-height:1.5">Answer</span>
            </div>
          </div>
          <p th:if="${results.isEmpty() && textAnswers.isEmpty()}" style="padding:18px;background:#faf9ff;border-radius:14px;color:#64748b">No responses were submitted before this poll closed.</p>
          <a th:href="${baseUrl + '/pool/' + pool.id}" style="display:inline-block;margin-top:22px;padding:13px 20px;border-radius:12px;background:#6d28d9;color:#fff;text-decoration:none;font-weight:800">Open poll</a>
        </td></tr>
        <tr><td style="padding:20px 32px;border-top:1px solid #ede9fe;color:#7c8193;font-size:12px">Sent automatically by WebPool to the poll participants.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
